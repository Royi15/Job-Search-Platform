# /etc/nginx/sites-available/jobsearch
# certbot rewrites this for HTTPS after `certbot --nginx`.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name api.your-domain.example;   # <-- change

    # Largest upload accepted is a notebook/quiz MP3 (max_notebook_audio_bytes
    # = 150MB in backend/app/core/config.py) — sized with headroom above that.
    # Resume/notebook/quiz PDF+PPTX uploads (max 20MB) fit comfortably under it.
    client_max_body_size 160m;

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        # A slow client sending a 150MB file needs more than nginx's default
        # 60s to finish sending the request body, or nginx aborts the upload
        # with a 408 before it ever reaches FastAPI.
        client_body_timeout 300s;
    }
}
